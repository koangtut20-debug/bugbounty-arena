<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - BugBounty Arena</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        nav {
            background: #222;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: #00c853;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            b            b            b                 b            b            b                         b            b   ext-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #222;
            color: white;
        }

        tr:hover {
            background: #f1f1f1;
        }

        .rank {
            font-weight: bold;
        }

        .points {
            font-weight: bold;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
    </style>
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="challenges.html">Challenges</a>
    <a href="leaderboard.html">Leaderboard</a>
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
</nav>

<div class="container">

    <h1>🏆 BugBounty Leaderboard</h1>

    <p class="subtitle">
        See who has earned the most points!
    </p>

    <table>
        <thead>
            <tr>
                <th>Rank</th>
                <th>Name</th>
                <th>Points</th>
            </tr>
        </thead>

        <tbody id="leaderboardBody"></tbody>
    </table>

    <p id="message">Loading leaderboard...</p>

</div>

<script>
    fetch("/api/leaderboard")
        .then(response => {
            if (!response.ok) {
                throw new Error("Failed to load leaderboard");
            }
            return response.json();
        })
        .then(users => {

            const leaderboardBody =
                document.getElementById("leaderboardBody");

            const message =
                document.getElementById("message");

            leaderboardBody.innerHTML = "";

            users.forEach((user, index) => {

                const row = document.createElement("tr");

                row.innerHTML = `
                    <td class="rank">${index + 1}</td>
                    <td>${user.name}</td>
                    <td class="points">${user.points}</td>
                `;

                leaderboardBody.appendChild(row);
            });

            message.textContent =
                `${users.length} player(s) on the leaderboard.`;
        })
        .catch(error => {

            console.error(error);

            document.getElementById("message").textContent =
                "Unable to load leaderboard.";
        });
</script>

</body>
</html>
