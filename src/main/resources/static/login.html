<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BugBounty Arena</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            color: #222;
        }

        nav {
            background: #222;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            width: 350px;
            margin: 70px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 18px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #222;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #444;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>

<nav>
    <a href="/index.html">Home</a>
    <a href="/challenges.html">Challenges</a>
    <a href="/login.html">Login</a>
    <a href="/register.html">Register</a>
</nav>

<div class="container">

    <h1>🐛 BugBounty Arena</h1>

    <h2>Login</h2>

    <form id="loginForm">

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">Login</button>

    </form>

    <p id="message"></p>

</div>

<footer>
    © 2026 BugBounty Arena | Error Detection & Code Debugging Platform
</footer>

<script>

document.getElementById("loginForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    message.textContent = "Logging in...";

    fetch("/api/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            email: email,
            password: password
        })
    })
    .then(response => response.text())
    .then(result => {

        if (result === "Login successful") {

            localStorage.setItem("userEmail", email);

            message.textContent = "✅ Login successful!";

            setTimeout(function() {
                window.location.href = "/index.html";
            }, 1000);

        } else {

            message.textContent = "❌ " + result;

        }

    })
    .catch(error => {

        console.error(error);

        message.textContent = "❌ Login failed. Please try again.";

    });

});

</script>

</body>
</html>
